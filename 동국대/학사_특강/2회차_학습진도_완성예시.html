<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>학습 진도 체크 · 동국대 AI 특강 완성 예시</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f1ea;color:#1c2430;font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;line-height:1.75}main{max-width:920px;margin:auto;padding:38px 22px 60px}a{color:#0e7c74}h1{font-size:clamp(28px,5vw,40px);line-height:1.3;margin:8px 0 18px}h2{font-size:25px;line-height:1.4;margin:34px 0 16px;border-bottom:3px solid #c856b8;padding-bottom:10px}h3{font-size:19px;margin:20px 0 8px}.lead,.muted{color:#5e6773}.note{background:#e1f2ef;padding:16px 20px;border-radius:12px;margin:20px 0}.warn{background:#fbf3e6}nav{display:flex;flex-wrap:wrap;gap:8px 18px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#fff;padding:20px;border:1px solid #e3ddd2;border-radius:10px;font:inherit;font-size:15px;line-height:1.7}button,.button{display:inline-block;font:inherit;font-weight:700;background:#0e7c74;color:#fff;padding:10px 20px;border:0;border-radius:8px;cursor:pointer;text-decoration:none}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #c856b8;outline-offset:3px}label{display:block;font-weight:700;margin-top:12px}input,textarea{width:100%;font:inherit;padding:10px 12px;border:1px solid #aab1b8;border-radius:6px;color:inherit;background:white}textarea{min-height:85px}details{margin:18px 0;padding:16px 20px;background:#fff;border:1px solid #e3ddd2;border-radius:10px}summary{font-weight:700;cursor:pointer}table{width:100%;border-collapse:collapse;margin:18px 0}th,td{text-align:left;vertical-align:top;border-bottom:1px solid #ddd5c9;padding:10px 8px}th{background:#e1f2ef}code{overflow-wrap:anywhere}.status{color:#0e7c74;margin-left:10px}.checklist{padding-left:22px}.step{scroll-margin-top:20px}footer{margin-top:35px;color:#5e6773;font-size:14px}@media(max-width:520px){main{padding:25px 16px}th,td{font-size:14px;padding:8px 5px}}@media print{button,.button,nav{display:none}main{max-width:none;padding:0}body{background:white}pre,details,.note{break-inside:avoid}h2{break-after:avoid}}main{max-width:820px}.task{display:flex;align-items:center;gap:14px;background:white;padding:16px;margin:10px 0;border-radius:10px}.task input{width:24px;height:24px;flex-shrink:0}.task label{flex:1;margin:0;overflow-wrap:anywhere}.task button{background:#5e6773;padding:6px 12px;font-size:14px}.done label{text-decoration:line-through;color:#5e6773}form{display:flex;gap:10px}form input{min-width:0;flex:1}form button{white-space:nowrap;flex-shrink:0}.progress{font-size:30px;font-weight:700;color:#0e7c74}@media(max-width:500px){form{flex-wrap:wrap}form input{flex-basis:100%}} </style></head><body><main><a href="2회차_웹앱만들기_실습안내.html">실습 안내서</a><p class="muted">동국대 AI 특강 · 완성 예시</p><h1>나의 교육학 공부 계획</h1><p>이번 주에 할 공부를 적고, 끝내면 표시하세요.</p><form id="add-form"><label for="task-input" class="muted" style="position:absolute;clip-path:inset(50%);width:1px;height:1px;overflow:hidden">추가할 할 일</label><input id="task-input" placeholder="예: 형성평가 개념 복습" maxlength="120" autocomplete="off"><button type="submit">추가</button></form><p id="message" role="status" aria-live="polite"></p><p class="progress" id="progress"></p><div id="tasks"></div><p><button id="sample" type="button">가상 예시 3개 추가</button></p><p class="muted" id="storage-note">목록은 이 브라우저에만 저장됩니다. 실명이나 성적을 넣지 마세요.</p><footer>이 페이지는 확인 연습용 예시입니다. 내 앱 제작을 대신하지 않습니다.</footer></main><script>
const KEY='dongguk-session2-demo-v1';let tasks=[];let storageOK=true;
try{const v=JSON.parse(localStorage.getItem(KEY)||'[]');if(Array.isArray(v))tasks=v.filter(x=>x&&typeof x.text==='string'&&typeof x.id==='string'&&typeof x.done==='boolean').slice(0,200);}catch(e){storageOK=false;}
function save(){try{localStorage.setItem(KEY,JSON.stringify(tasks));}catch(e){storageOK=false;}if(!storageOK)document.getElementById('storage-note').textContent='이 브라우저에서 저장을 쓸 수 없습니다. 새로고침하면 목록이 사라질 수 있습니다.';}
function render(){const list=document.getElementById('tasks');list.replaceChildren();document.getElementById('progress').textContent=tasks.filter(x=>x.done).length+' / '+tasks.length+'개 완료';if(!tasks.length){const p=document.createElement('p');p.textContent='아직 할 일이 없습니다. 위에서 하나 추가해 보세요.';list.appendChild(p);}for(const t of tasks){const row=document.createElement('div');row.className='task'+(t.done?' done':'');const cb=document.createElement('input');cb.type='checkbox';cb.id='task-'+t.id;cb.checked=t.done;cb.addEventListener('change',()=>{t.done=cb.checked;save();render();});const label=document.createElement('label');label.htmlFor=cb.id;label.textContent=t.text;const del=document.createElement('button');del.type='button';del.textContent='삭제';del.setAttribute('aria-label',t.text+' 삭제');del.addEventListener('click',()=>{tasks=tasks.filter(x=>x.id!==t.id);save();render();});row.append(cb,label,del);list.append(row);}}
function add(text){if(tasks.length>=200){document.getElementById('message').textContent='예시에서는 할 일을 200개까지 저장합니다.';return false;}tasks.push({id:crypto.randomUUID?crypto.randomUUID():String(Date.now())+'-'+Math.random().toString(16).slice(2),text,done:false});save();render();return true;}
document.getElementById('add-form').addEventListener('submit',e=>{e.preventDefault();const input=document.getElementById('task-input');const text=input.value.trim();if(!text){document.getElementById('message').textContent='할 일을 입력해 주세요.';input.focus();return;}if(add(text)){input.value='';document.getElementById('message').textContent='할 일을 추가했습니다.';input.focus();}});
document.getElementById('sample').addEventListener('click',()=>{for(const text of ['형성평가 개념 복습','수업 설계 사례 읽기','교육심리 발표 준비'])if(!tasks.some(x=>x.text===text))add(text);document.getElementById('message').textContent='가상 예시를 추가했습니다.';});save();render();
</script></body></html>
