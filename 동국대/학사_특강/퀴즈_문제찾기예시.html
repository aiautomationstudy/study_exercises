<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>교육평가 개념 복습 퀴즈</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#F5F1EA;color:#1C2430;font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;padding:36px 18px}
main{max-width:760px;margin:auto}
.kicker{color:#0E7C74;font-weight:700;font-size:15px;border-left:4px solid #C856B8;padding-left:10px}
h1{font-size:30px;margin:14px 0 6px}
.sub{color:#5E6773;margin:0 0 22px}
.card{background:#fff;border-radius:16px;padding:28px;box-shadow:0 4px 20px rgba(23,32,51,.07)}
.progress{display:flex;justify-content:space-between;color:#5E6773;font-size:15px;margin-bottom:14px}
.q{font-size:21px;font-weight:700;line-height:1.55;margin:0 0 20px}
label{display:flex;gap:12px;align-items:center;border:1.5px solid #E3DDD2;border-radius:10px;padding:14px 16px;margin:10px 0;font-size:18px;cursor:pointer}
label:has(input:checked){border-color:#0E7C74;background:#E1F2EF}
input{accent-color:#0E7C74;width:18px;height:18px}
.row{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
button{font:inherit;font-size:17px;font-weight:700;border:0;border-radius:999px;padding:12px 26px;cursor:pointer}
.primary{background:#0E7C74;color:#fff} .ghost{background:#EAE5DB;color:#1C2430}
#msg{min-height:24px;color:#B4385A;font-weight:700;margin:14px 0 0}
.fb{margin-top:16px;border-radius:10px;padding:16px 18px;line-height:1.65;font-size:17px}
.ok{background:#E1F2EF;border-left:5px solid #0E7C74} .no{background:#FBEAEA;border-left:5px solid #C0485A}
.score{text-align:center;padding:16px 0} .score b{font-size:56px;color:#0E7C74}
footer{color:#8A929C;font-size:13px;margin-top:18px}
</style></head>
<body><main>
<div class="kicker">AI 특강 실습 예시 · 문제 찾기용</div>
<h1>진단 · 형성 · 총괄, 구분할 수 있나요?</h1>
<p class="sub">문제를 읽고 답을 고른 뒤 「확인」을 누르세요.</p>
<div class="card" id="app"></div>
<footer>강의용 예시 문항입니다. 앱을 쓰는 동안 AI를 부르지 않습니다. 설명을 위해 문제 두 가지를 일부러 넣은 예시입니다.</footer>
</main>
<script>
const QUIZ = [{"q": "교사가 수업 중간에 짧은 퀴즈를 내고, 학생들이 많이 틀린 부분을 다음 시간에 다시 설명했습니다. 이 평가는?", "answer": "형성평가", "why": "수업이 진행되는 중에 이해 정도를 확인하고, 그 결과로 가르치는 방법을 바꿨기 때문입니다."}, {"q": "새 단원을 시작하기 전에, 학생들이 앞 단원 내용을 알고 있는지 확인했습니다. 이 평가는?", "answer": "진단평가", "why": "가르치기 전에 출발점(이미 아는 것과 모르는 것)을 확인하는 평가이기 때문입니다."}, {"q": "학기가 끝날 때 한 학기 동안 배운 내용을 종합해 성적을 매겼습니다. 이 평가는?", "answer": "총괄평가", "why": "학습이 끝난 뒤 최종 성취를 판단하는 평가이기 때문입니다."}];
const OPTIONS = ["진단평가", "형성평가", "총괄평가"];
let idx = 0, score = 0, selected = null, checked = false;
const app = document.getElementById('app');

function render() {
  if (idx >= QUIZ.length) {
    app.innerHTML = `<div class="score"><p>${QUIZ.length}문제 중</p><b>${score}</b><p>문제를 맞혔습니다</p></div>
      <div class="row" style="justify-content:center"><button class="primary" id="again">다시 풀기</button></div>`;
    document.getElementById('again').onclick = restart;
    return;
  }
  const item = QUIZ[idx];
  selected = null; checked = false;
  app.innerHTML = `<div class="progress"><span>문제 ${idx + 1} / ${QUIZ.length}</span><span>맞힌 문제 ${score}</span></div>
    <p class="q">${item.q}</p>
    ${OPTIONS.map(o => `<label><input type="radio" name="opt" value="${o}"> ${o}</label>`).join('')}
    <div class="row"><button class="primary" id="check">확인</button><button class="ghost" id="next" hidden>다음 문제 →</button></div>
    <p id="msg" role="status"></p><div id="fb"></div>`;
  document.querySelectorAll('[name=opt]').forEach(el => el.onchange = () => {
    if (checked) return;
    selected = el.value; document.getElementById('msg').textContent = '';
  });
  document.getElementById('check').onclick = check;
  document.getElementById('next').onclick = () => { idx++; render(); };
}

function check() {
  if (checked) return;
  const msg = document.getElementById('msg');
  if (!selected) { selected = QUIZ[idx].answer; }
  const item = QUIZ[idx];
  const right = selected === item.answer;
  if (right) score++;
  checked = true;
  document.querySelectorAll('[name=opt]').forEach(el => el.disabled = true);
  document.getElementById('fb').innerHTML = `<div class="fb ${right ? 'ok' : 'no'}"><b>${right ? '맞았습니다!' : '아쉬워요. 정답은 ' + item.answer + '입니다.'}</b><br>${item.why}</div>`;
  document.getElementById('check').hidden = true;
  const next = document.getElementById('next');
  next.hidden = false; next.textContent = idx === QUIZ.length - 1 ? '결과 보기 →' : '다음 문제 →';
}

function restart() {
  idx = 0;
  render();
}
render();
</script></body></html>
